<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Front End Test - Luxury Edition</title>
    
    <!-- Google Fonts: Outfit for high-end typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #050811;
            color: #f1f5f9;
        }

        /* Canvas background styling */
        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Centered main container */
        .wrapper {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Glassmorphism Card Container */
        .glass-card {
            background: rgba(10, 17, 32, 0.55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 242, 254, 0.18);
            border-radius: 24px;
            padding: 50px 40px;
            text-align: center;
            max-width: 680px;
            width: 100%;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.7),
                0 0 40px rgba(0, 242, 254, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: cardEntrance 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
            overflow: hidden;
        }

        /* Top metallic accent line */
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 15%;
            right: 15%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 242, 254, 0.8), transparent);
        }

        /* Sub-tag indicator */
        .tag {
            display: inline-block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 600;
            color: #00f2fe;
            background: rgba(0, 242, 254, 0.08);
            border: 1px solid rgba(0, 242, 254, 0.25);
            padding: 6px 16px;
            border-radius: 50px;
            margin-bottom: 24px;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.15);
        }

        /* Typography Styling */
        h1 {
            font-size: clamp(1.6rem, 4vw, 2.3rem);
            font-weight: 700;
            line-height: 1.25;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 30%, #a5f3fc 70%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
            text-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        h2 {
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            font-weight: 300;
            color: #94a3b8;
            letter-spacing: 1.5px;
            margin-bottom: 40px;
            text-transform: uppercase;
        }

        h2 span {
            color: #e2e8f0;
            font-weight: 600;
        }

        /* Luxury Gradient Button */
        .btn-container {
            display: inline-block;
            position: relative;
        }

        .luxury-btn {
            position: relative;
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.15), rgba(79, 172, 254, 0.25));
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            padding: 18px 42px;
            border: 1px solid rgba(0, 242, 254, 0.4);
            border-radius: 50px;
            cursor: pointer;
            outline: none;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(10px);
            overflow: hidden;
            box-shadow: 
                0 10px 25px -5px rgba(0, 242, 254, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        /* Shimmering animation on hover */
        .luxury-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 50%;
            height: 200%;
            background: linear-gradient(
                60deg, 
                transparent, 
                rgba(255, 255, 255, 0.4), 
                transparent
            );
            transform: rotate(25deg);
            transition: all 0.7s ease;
        }

        .luxury-btn:hover {
            transform: translateY(-3px) scale(1.02);
            border-color: rgba(0, 242, 254, 0.8);
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.3), rgba(79, 172, 254, 0.45));
            box-shadow: 
                0 15px 35px -5px rgba(0, 242, 254, 0.45),
                0 0 25px rgba(0, 242, 254, 0.3);
        }

        .luxury-btn:hover::after {
            left: 130%;
        }

        .luxury-btn:active {
            transform: translateY(1px) scale(0.98);
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.2);
        }

        /* Keyframes */
        @keyframes cardEntrance {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>
<body>

    <!-- Background Particles Canvas -->
    <canvas id="particle-canvas"></canvas>

    <!-- Main Content Container -->
    <div class="wrapper">
        <main class="glass-card">
            <span class="tag">Electronic Workshop</span>
            
            <h1>THIS IS MY DIAGRAM OF THE PRINCIPAL PROCESS OF MY COMPANY</h1>
            
            <h2>MY NAME IS <span>JESUS ADRIAN SOTO LUCERO</span></h2>
            
            <div class="btn-container">
                <button 
                    class="luxury-btn" 
                    onclick="window.location.href='C:\\Users\\jadri\\OneDrive\\Desktop\\Escuela\\Practices\\4b_practices_soto\\miempresaa.html'">

                </button>
                <button 
                    class="luxury-btn" 
                    onclick="window.location.href='C:\\Users\\jadri\\OneDrive\\Desktop\\Escuela\\Practices\\4b_practices_soto\\miempresaa.html'">
                    Click here to go to the money diagram
                </button>
                <button 
                    class="luxury-btn"

            </div>
        </main>
    </div>

    <script>
        // Particle System Script
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        let mouse = { x: null, y: null, radius: 150 };

        // Resize Canvas to fit screen window
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Track Mouse Movement for Interactive Physics
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });

        window.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
        });

        // Particle Class definition
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.radius = Math.random() * 2 + 0.5;
                this.baseX = this.x;
                this.baseY = this.y;
                this.vx = (Math.random() - 0.5) * 0.6;
                this.vy = (Math.random() - 0.5) * 0.6;
                this.alpha = Math.random() * 0.5 + 0.2;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 242, 254, ${this.alpha})`;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00f2fe';
                ctx.fill();
            }

            update() {
                // Movement logic
                this.x += this.vx;
                this.y += this.vy;

                // Bounce off screen boundaries
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

                // Mouse interaction - magnetic push
                if (mouse.x !== null && mouse.y !== null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < mouse.radius) {
                        let force = (mouse.radius - distance) / mouse.radius;
                        let directionX = dx / distance;
                        let directionY = dy / distance;
                        this.x -= directionX * force * 3;
                        this.y -= directionY * force * 3;
                    }
                }
            }
        }

        // Initialize particles
        function initParticles() {
            particles = [];
            const numberOfParticles = Math.floor((canvas.width * canvas.height) / 9000);
            for (let i = 0; i < numberOfParticles; i++) {
                particles.push(new Particle());
            }
        }
        initParticles();

        // Connect nearby particles with faint cyan lines
        function connectParticles() {
            const maxDistance = 120;
            for (let a = 0; a < particles.length; a++) {
                for (let b = a + 1; b < particles.length; b++) {
                    let dx = particles[a].x - particles[b].x;
                    let dy = particles[a].y - particles[b].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < maxDistance) {
                        let opacity = (1 - distance / maxDistance) * 0.25;
                        ctx.strokeStyle = `rgba(0, 242, 254, ${opacity})`;
                        ctx.lineWidth = 0.8;
                        ctx.beginPath();
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        // Animation Loop
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }

            connectParticles();
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
